name: Release VirusTotal analysis

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to analyze
        required: true
        default: v1.0.2
      asset:
        description: Exact release ZIP asset name
        required: true
        default: zapret2-youtube-discord-v1.0.2.zip

permissions:
  contents: write

concurrency:
  group: virustotal-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload-and-analyze:
    name: Upload exact GitHub Release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Select release asset
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          asset="$INPUT_ASSET"
          printf 'tag=%s\nasset=%s\n' "$tag" "$asset" | tee -a "$GITHUB_OUTPUT"

      - name: Download exact release assets from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "$RELEASE_ASSET" --dir dist
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir dist
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt.asc --dir dist
          gh release download "$RELEASE_TAG" --pattern release-signing-key.asc --dir dist

      - name: Verify GitHub Release asset before submission
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          cd dist
          gpg --import release-signing-key.asc
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ..
          python - "$RELEASE_ASSET" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          asset = Path("dist") / sys.argv[1]
          if asset.read_bytes()[:4] != b"PK\x03\x04":
              raise SystemExit("release asset is not a ZIP archive")
          with zipfile.ZipFile(asset) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failed at {bad}")
              scripts = [n for n in bundle.namelist() if n.lower().endswith((".bat", ".cmd"))]
              profiles = [n for n in bundle.namelist() if "/profiles/" in n and n.lower().endswith(".txt")]
              for name in scripts + profiles:
                  data = bundle.read(name)
                  if b"\n" in data.replace(b"\r\n", b""):
                      raise SystemExit(f"LF-only line ending: {name}")
              print(f"ZIP verified: {len(bundle.namelist())} files, {len(scripts)} scripts, {len(profiles)} profiles")
          PY

      - name: Upload to VirusTotal and wait for analysis
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          python tools/upload_virustotal.py "dist/$RELEASE_ASSET" --report VIRUSTOTAL.md

      - name: Add verified report to GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body --jq .body > RELEASE_NOTES.md
          python - <<'PY'
          from pathlib import Path
          notes = Path("RELEASE_NOTES.md").read_text(encoding="utf-8").rstrip()
          report = Path("VIRUSTOTAL.md").read_text(encoding="utf-8").strip()
          marker = "## VirusTotal analysis"
          if marker in notes:
              notes = notes.split(marker, 1)[0].rstrip()
          Path("RELEASE_NOTES.updated.md").write_text(notes + "\n\n" + report + "\n", encoding="utf-8")
          PY
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.updated.md

      - name: Upload public verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: virustotal-${{ steps.release.outputs.tag }}
          path: |
            VIRUSTOTAL.md
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.asc
          if-no-files-found: error
          retention-days: 90
